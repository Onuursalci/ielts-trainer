<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Trainer — Practice Questions</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body data-page="practice">
  <header id="hdr" class="site-header"></header>
  <div class="container"><nav class="app-nav" id="nav" aria-label="Main"></nav></div>

  <main class="container">
    <div class="page-head">
      <div>
        <h1 class="st2d" data-i18n="practice.title" style="margin:0"></h1>
        <p class="sub" data-i18n="practice.sub"></p>
        <p class="c1r g500" style="margin:6px 0 0"><span data-i18n="practice.timedNote"></span> <a href="mock-tests.html" style="color:var(--blue700);font-weight:500" data-i18n="practice.timedLink"></a></p>
      </div>
    </div>

    <div class="flex gap8 wrap" id="tabs"></div>
    <div id="list" class="mt24 practice-grid"></div>
    <p class="c1r g500 mt24" data-i18n="practice.notice"></p>
  </main>

  <footer id="footer" class="site-footer"></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/extra-listening.js"></script>
  <script src="assets/js/extra-reading.js"></script>
  <script src="assets/js/extra-writing.js"></script>
  <script src="assets/js/extra-speaking.js"></script>
  <script src="assets/js/extra-plan.js"></script>
  <script src="assets/js/extra-listening2.js"></script>
  <script src="assets/js/extra-listening3.js"></script>
  <script src="assets/js/extra-listening4.js"></script>
  <script src="assets/js/extra-reading2.js"></script>
  <script src="assets/js/extra-reading3.js"></script>
  <script src="assets/js/extra-reading4.js"></script>
  <script src="assets/js/extra-writing2.js"></script>
  <script src="assets/js/extra-writing3.js"></script>
  <script src="assets/js/extra-speaking2.js"></script>
  <script src="assets/js/extra-speaking3.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/profiles.js"></script>
  <script>
    (function () {
      var A = window.APP, D = window.APP_DATA;
      var tabs = [
        { key: "listening", label: "practice.tabListening" },
        { key: "reading", label: "practice.tabReading" },
        { key: "writing", label: "practice.tabWriting" },
        { key: "speaking", label: "practice.tabSpeaking" }
      ];
      var active = "listening";

      function renderTabs() {
        A.qs("#tabs").innerHTML = tabs.map(function (tb) {
          return '<button class="wt' + (tb.key === active ? " on" : "") + '" data-tab="' + tb.key + '">' +
            A.esc(A.t(tb.label)) + "</button>";
        }).join("");
      }

      function renderList() {
        var items = D.PRACTICE[active] || [];
        A.qs("#list").innerHTML = items.map(function (it) {
          var chips = it.types.map(function (ty) { return '<span class="chip chip-line">' + A.esc(ty) + "</span>"; }).join("");
          var card = '<div class="mat-card hoverable">' +
            '<div class="flex items-center justify-between">' +
            '<div class="ic">' + (active === "listening" ? "🎧" : active === "reading" ? "📖" : active === "writing" ? "✍️" : "🗣️") + "</div>" +
            '<a class="btn btn-black btn-sm" href="' + it.link + '">' + A.esc(A.t("common.open")) + "</a>" +
            "</div>" +
            '<h3>' + A.esc(it.title) + "</h3>" +
            '<p>' + A.esc(it.sub) + "</p>" +
            '<div class="flex gap8 wrap mt12">' + chips + "</div>" +
            "</div>";
          return card;
        }).join("");
        if (!items.length) {
          A.qs("#list").innerHTML = '<div class="empty" style="grid-column:1/-1">' + A.esc(A.t("practice.empty")) + '</div>';
        }
      }

      function renderAll() { renderTabs(); renderList(); A.applyI18n(document); }

      document.addEventListener("DOMContentLoaded", function () {
        renderAll();
        A.qs("#tabs").addEventListener("click", function (e) {
          var b = e.target.closest("button[data-tab]");
          if (!b) return;
          active = b.getAttribute("data-tab");
          renderAll();
        });
        document.addEventListener("langchange", renderAll);
      });
    })();
  </script>
</body>
</html>
