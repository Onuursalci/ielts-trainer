<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Trainer — 8-Week Study Plan</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body data-page="home">
  <header id="hdr" class="site-header"></header>
  <div class="container"><nav class="app-nav" id="nav" aria-label="Main"></nav></div>

  <main class="container">
    <section class="hero">
      <h1 class="st1d" data-i18n="home.heroTitle"></h1>
      <p class="sub" data-i18n="home.heroSub"></p>
      <div class="cta">
        <a class="btn btn-red btn-lg" href="study-center.html" data-i18n="home.ctaStudy"></a>
        <a class="btn btn-ghost btn-lg" href="mock-tests.html" data-i18n="home.ctaTests"></a>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div>
          <h2 class="st2d" data-i18n="home.materialsTitle"></h2>
          <p class="section-desc" data-i18n="home.materialsSub"></p>
        </div>
      </div>
      <div class="materials">
        <div class="mat-card hoverable">
          <div class="ic">🎧</div>
          <h3 data-i18n="home.matListening"></h3>
          <p data-i18n="home.matListeningDesc"></p>
        </div>
        <div class="mat-card hoverable">
          <div class="ic">📖</div>
          <h3 data-i18n="home.matReading"></h3>
          <p data-i18n="home.matReadingDesc"></p>
        </div>
        <div class="mat-card hoverable">
          <div class="ic">✍️</div>
          <h3 data-i18n="home.matWriting"></h3>
          <p data-i18n="home.matWritingDesc"></p>
        </div>
        <div class="mat-card hoverable">
          <div class="ic">🗣️</div>
          <h3 data-i18n="home.matSpeaking"></h3>
          <p data-i18n="home.matSpeakingDesc"></p>
        </div>
        <div class="mat-card hoverable">
          <div class="ic">📝</div>
          <h3 data-i18n="home.matMock"></h3>
          <p data-i18n="home.matMockDesc"></p>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="st2d" data-i18n="home.roadmapTitle"></h2>
      <p class="section-desc" data-i18n="home.roadmapSub"></p>
      <div class="roadmap">
        <div class="rm">
          <b>📅 <span data-i18n="home.rm1t"></span></b>
          <p data-i18n="home.rm1d"></p>
        </div>
        <div class="rm">
          <b>🗓️ <span data-i18n="home.rm2t"></span></b>
          <p data-i18n="home.rm2d"></p>
        </div>
        <div class="rm">
          <b>🧭 <span data-i18n="home.rm3t"></span></b>
          <p data-i18n="home.rm3d"></p>
        </div>
        <div class="rm">
          <b>🔁 <span data-i18n="home.rm4t"></span></b>
          <p data-i18n="home.rm4d"></p>
        </div>
        <div class="rm">
          <b>⚖️ <span data-i18n="home.rm5t"></span></b>
          <p data-i18n="home.rm5d"></p>
        </div>
      </div>
    </section>

    <section class="section card card-pad" style="background:var(--gray50);border:0;text-align:center;padding:48px 24px">
      <h2 class="st2d" data-i18n="home.finalTitle" style="margin:0 0 8px"></h2>
      <p class="g600" data-i18n="home.finalSub" style="margin:0 0 24px"></p>
      <a class="btn btn-red btn-lg" href="study-center.html" data-i18n="home.ctaGetStarted"></a>
    </section>
  </main>

  <footer id="footer" class="site-footer"></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/extra-listening.js"></script>
  <script src="assets/js/extra-reading.js"></script>
  <script src="assets/js/extra-writing.js"></script>
  <script src="assets/js/extra-speaking.js"></script>
  <script src="assets/js/extra-plan.js"></script>
  <script src="assets/js/extra-listening2.js"></script>
  <script src="assets/js/extra-listening3.js"></script>
  <script src="assets/js/extra-listening4.js"></script>
  <script src="assets/js/extra-reading2.js"></script>
  <script src="assets/js/extra-reading3.js"></script>
  <script src="assets/js/extra-reading4.js"></script>
  <script src="assets/js/extra-writing2.js"></script>
  <script src="assets/js/extra-writing3.js"></script>
  <script src="assets/js/extra-speaking2.js"></script>
  <script src="assets/js/extra-speaking3.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/profiles.js"></script>
</body>
</html>
