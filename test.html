<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Trainer — Test</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body class="player" data-page="test">
  <div class="player-top">
    <div class="inner">
      <div style="display:flex;align-items:center;gap:14px;min-width:0">
        <a class="btn btn-ghost btn-sm" href="mock-tests.html" id="btnLeave" data-i18n="player.leave"></a>
        <div class="player-title" id="playerTitle"></div>
      </div>
      <div class="section-chips" id="secChips"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="lang-toggle sm" id="langToggle" role="group" aria-label="Language">
          <button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button>
        </div>
        <div class="timer" id="timer">--:--</div>
        <button class="btn btn-red" id="btnSubmitTop" data-i18n="player.submit"></button>
      </div>
    </div>
  </div>

  <div class="player-body">
    <div class="player-main">
      <aside class="answer-rail hidden" id="rail">
        <div class="flex items-center justify-between mb8">
          <b class="b4m" data-i18n="player.answerSheet"></b>
          <span class="c2r g500" id="railProgress"></span>
        </div>
        <div class="q-grid" id="qGrid"></div>
        <div class="rail-legend">
          <span><i class="k dark"></i><span data-i18n="player.legendAnswered"></span></span>
          <span><i class="k cur"></i><span data-i18n="player.legendCurrent"></span></span>
          <span><i class="k flag"></i><span data-i18n="player.legendFlag"></span></span>
        </div>
      </aside>
      <section id="stage" style="flex:1;min-width:0"></section>
    </div>
  </div>

  <div class="section-cta">
    <button class="btn btn-ghost" id="btnPrev" data-i18n="player.prev"></button>
    <button class="btn btn-blue" id="btnNext"></button>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/extra-listening.js"></script>
  <script src="assets/js/extra-reading.js"></script>
  <script src="assets/js/extra-writing.js"></script>
  <script src="assets/js/extra-speaking.js"></script>
  <script src="assets/js/extra-plan.js"></script>
  <script src="assets/js/extra-listening2.js"></script>
  <script src="assets/js/extra-listening3.js"></script>
  <script src="assets/js/extra-listening4.js"></script>
  <script src="assets/js/extra-reading2.js"></script>
  <script src="assets/js/extra-reading3.js"></script>
  <script src="assets/js/extra-reading4.js"></script>
  <script src="assets/js/extra-writing2.js"></script>
  <script src="assets/js/extra-writing3.js"></script>
  <script src="assets/js/extra-speaking2.js"></script>
  <script src="assets/js/extra-speaking3.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/player.js"></script>
</body>
</html>
